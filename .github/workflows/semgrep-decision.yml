# Semgrep PR gate, step 2 of 2: the manual decision.
#
# After the scan has posted findings on a PR, a reviewer with write access
# submits a PR review:
#   Approve (or review comment "/approve")          -> PR is merged
#   Request changes (or review comment "/reject")   -> PR is closed
# Reviews on PRs without pending findings are ignored. Needs no paid GitHub
# plan (unlike environment required reviewers on private repos).
name: Semgrep Decision

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: semgrep-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  decide:
    name: Apply reviewer decision
    runs-on: [self-hosted, sast-gate]
    timeout-minutes: 5
    permissions:
      contents: write        # merge
      pull-requests: write   # comment, merge, close
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Run the base branch's copy of the script, not the PR's.
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Merge on approve, close on reject
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEWER_ASSOCIATION: ${{ github.event.review.author_association }}
        run: python .github/scripts/semgrep_gate.py decide
